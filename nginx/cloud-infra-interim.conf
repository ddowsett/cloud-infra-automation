# INTERIM config: HTTPS + path routing, NO SSO. Use until oauth2-proxy / Entra is live,
# then replace with nginx/cloud-infra.conf (the SSO version).
#
# One file serves dev and prod (server_name _), using the managed cert at /opt/managedcerts.
# The landing page is a static file in the repo (it embeds the logo, which is far larger
# than nginx's ~4 KB limit on a single config value, so it cannot live in a `return '...'`).
#
# Install: cd /opt/cloud-infra-automation && sudo git pull
#          sudo cp nginx/cloud-infra-interim.conf /etc/nginx/conf.d/cloud-infra.conf
#          sudo nginx -t && sudo systemctl reload nginx
#
# WARNING: /zone-sharing/ makes real Route 53 changes and has NO login in this config.
# Do not enable the zone-sharing service on prod until SSO is in front of it.

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    absolute_redirect off;

    ssl_certificate     /opt/managedcerts/server.crt;
    ssl_certificate_key /opt/managedcerts/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /url-lookup/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /url-lookup;
    }

    location /zone-sharing/ {
        proxy_pass         http://127.0.0.1:8080/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /zone-sharing;
    }

    # Landing page (static file from the repo; updates with `git pull`).
    location = / {
        alias /opt/cloud-infra-automation/nginx/landing.html;
        default_type text/html;
    }
}
