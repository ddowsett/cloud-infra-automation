# Reverse proxy for the Cloud Infrastructure automation web apps.
# Both apps run as local-only backend services on i-09daf85c55e1ab7f7 and are
# exposed by PATH under a single host:
#
#   /url-lookup/    -> FastAPI resolver   (127.0.0.1:8000)
#   /zone-sharing/  -> Flask zone-sharing (127.0.0.1:8080)
#
# The path prefix is STRIPPED before proxying so each backend still serves from
# "/". The zone-sharing Flask app needs no code change as a result; the resolver
# uses relative URLs in its UI and uvicorn --root-path for correct link gen.
#
# Install: /etc/nginx/conf.d/cloud-infra.conf  then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;

    # --- URL Lookup (FastAPI resolver) ---
    location /url-lookup/ {
        proxy_pass         http://127.0.0.1:8000/;   # trailing slash strips the /url-lookup/ prefix
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Tell the app its external mount point for correct link generation.
        proxy_set_header   X-Forwarded-Prefix /url-lookup;
    }

    # --- Zone Sharing (Flask) ---
    location /zone-sharing/ {
        proxy_pass         http://127.0.0.1:8080/;   # trailing slash strips the /zone-sharing/ prefix
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /zone-sharing;
    }

    # Landing page: simple index linking to both tools.
    location = / {
        default_type text/html;
        return 200 '<!doctype html><html><body style="font-family:sans-serif;margin:2rem">\n<h1>CSAA Cloud Infrastructure Automation</h1>\n<ul>\n<li><a href="/url-lookup/">URL &rarr; Infrastructure Resolver</a></li>\n<li><a href="/zone-sharing/">Route 53 Zone Sharing</a></li>\n</ul>\n</body></html>';
    }
}
