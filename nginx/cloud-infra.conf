# Reverse proxy for the Cloud Infrastructure automation web apps, behind Entra ID
# (Azure AD) SSO via oauth2-proxy. Both apps run as loopback-only backends and are
# exposed by PATH under one host:
#
#   /url-lookup/    -> FastAPI resolver   (127.0.0.1:8000)  group: GrpIG_Employees
#   /zone-sharing/  -> Flask zone-sharing (127.0.0.1:8080)  group: GrpIT_CloudInfrastructureTeam
#
# The path prefix is STRIPPED before proxying so each backend still serves from "/".
#
# AUTH MODEL
# ----------
# oauth2-proxy (127.0.0.1:4180) does the Entra OIDC login. nginx calls it with
# auth_request on every protected location. Group authorization is done BY
# oauth2-proxy, per location: each location calls /oauth2/auth/<GROUP_OBJECT_ID>,
# and the internal location below turns that into /oauth2/auth?allowed_groups=<GUID>.
# oauth2-proxy answers 202 (allowed), 401 (not signed in) or 403 (signed in, wrong group).
#
# Why not `if ($groups !~ ...) { return 403; }`: nginx evaluates `if`/`return` BEFORE
# the auth_request subrequest runs, so $groups (set by auth_request_set) is still empty
# and every user would be denied. Do not reintroduce that pattern.
#
# Entra emits group OBJECT IDs (GUIDs) in the groups claim, not names. Scope the app
# registration's groups claim to "groups assigned to the application" (see auth/README.md).
#
# Large pages are static files (landing.html, 403.html). nginx rejects any single config
# value over ~4 KB, so a page that embeds the logo cannot be an inline `return '...'`.
#
# PLACEHOLDERS to fill on the instance before `nginx -t`:
#   <GRPIG_EMPLOYEES_OBJECT_ID>   Entra object ID (GUID) of GrpIG_Employees
#   <GRPIT_CLOUDINFRA_OBJECT_ID>  Entra object ID (GUID) of GrpIT_CloudInfrastructureTeam
#   server_name / cert paths below are for DEV; change the FQDN for prod.
#
# Install: cd /opt/cloud-infra-automation && sudo git pull
#          sudo cp nginx/cloud-infra.conf /etc/nginx/conf.d/cloud-infra.conf
#          sudo nginx -t && sudo systemctl reload nginx

# Redirect all plain HTTP to HTTPS.
server {
    listen 80 default_server;
    server_name cloudinfraweb-dev.np.aws.csaa.pri;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name cloudinfraweb-dev.np.aws.csaa.pri;
    absolute_redirect off;

    # --- TLS (managed cert) ----------------------------------------------
    ssl_certificate     /opt/managedcerts/server.crt;
    ssl_certificate_key /opt/managedcerts/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- oauth2-proxy endpoints (sign in, callback, sign out) -------------
    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth subrequest, any signed-in user (used by the landing page).
    location = /oauth2/auth {
        internal;
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-Uri  $request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
    }

    # Auth subrequest, signed-in AND member of the group in the URL:
    # /oauth2/auth/<GUID> -> /oauth2/auth?allowed_groups=<GUID>
    # (regex locations win over the /oauth2/ prefix location above)
    location ~ ^/oauth2/auth/(?<grp>[0-9a-fA-F-]{36})$ {
        internal;
        set $args $args&allowed_groups=$grp;
        rewrite ^ /oauth2/auth break;
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-Uri  $request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
    }

    # 401 -> Entra sign-in, preserving the requested URL.
    error_page 401 = @sign_in;
    location @sign_in {
        return 302 https://$host/oauth2/start?rd=$scheme://$host$request_uri;
    }

    # 403 (signed in, wrong group) -> static "Access denied" page, status stays 403.
    error_page 403 /403.html;
    location = /403.html {
        internal;
        alias /opt/cloud-infra-automation/nginx/403.html;
        default_type text/html;
    }

    # --- URL Lookup (FastAPI resolver): GrpIG_Employees -------------------
    location /url-lookup/ {
        auth_request /oauth2/auth/<GRPIG_EMPLOYEES_OBJECT_ID>;
        auth_request_set $email $upstream_http_x_auth_request_email;

        proxy_pass         http://127.0.0.1:8000/;   # trailing slash strips the prefix
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /url-lookup;
        proxy_set_header   X-Auth-User       $email;
    }

    # --- Zone Sharing (Flask): GrpIT_CloudInfrastructureTeam --------------
    location /zone-sharing/ {
        auth_request /oauth2/auth/<GRPIT_CLOUDINFRA_OBJECT_ID>;
        auth_request_set $email $upstream_http_x_auth_request_email;

        proxy_pass         http://127.0.0.1:8080/;   # trailing slash strips the prefix
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /zone-sharing;
        proxy_set_header   X-Auth-User       $email;
    }

    # Landing page: any signed-in user. Static file, so auth_request really runs
    # (a `return` would execute before the access phase and skip the login).
    location = / {
        auth_request /oauth2/auth;
        alias /opt/cloud-infra-automation/nginx/landing.html;
        default_type text/html;
    }
}
