# HTTP-ONLY config: same routing as cloud-infra-interim.conf, but no TLS.
# For a server that doesn't have its certificate yet (prod, until the cert for
# cloudinfraweb.np.aws.csaa.pri is installed at /opt/managedcerts/).
#
# Install: sudo cp nginx/cloud-infra-http.conf /etc/nginx/conf.d/cloud-infra.conf
#          sudo nginx -t && sudo systemctl restart nginx
# When the cert arrives, switch to nginx/cloud-infra-interim.conf (HTTPS).
#
# WARNING: traffic is unencrypted, and /zone-sharing/ has NO login. Keep the
# zone-sharing service disabled on prod until TLS + SSO are in place.

server {
    listen 80 default_server;
    server_name _;
    absolute_redirect off;

    location /url-lookup/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /url-lookup;
    }

    location /zone-sharing/ {
        proxy_pass         http://127.0.0.1:8080/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /zone-sharing;
    }

    # Landing page (static file from the repo). Don't use `alias` here: "/" ends
    # in a slash, so nginx would hand it to the index module -> redirect cycle -> 500.
    location = / {
        root /opt/cloud-infra-automation/nginx;
        rewrite ^ /landing.html break;
    }
}
